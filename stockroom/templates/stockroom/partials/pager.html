{% if page_obj.has_other_pages %}
<nav class="pager" aria-label="Pages">
  {% if page_obj.has_previous %}
    <a class="btn btn-ghost" href="?page={{ page_obj.previous_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{% if status %}&amp;status={{ status }}{% endif %}{% if movement %}&amp;movement={{ movement }}{% endif %}{% if low_only %}&amp;low=1{% endif %}{% if over_only %}&amp;over=1{% endif %}{% if kind %}&amp;kind={{ kind }}{% endif %}{% if attribute %}&amp;attribute={{ attribute|urlencode }}{% endif %}{% if role %}&amp;role={{ role|urlencode }}{% endif %}">Previous</a>
  {% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn btn-ghost" href="?page={{ page_obj.next_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{% if status %}&amp;status={{ status }}{% endif %}{% if movement %}&amp;movement={{ movement }}{% endif %}{% if low_only %}&amp;low=1{% endif %}{% if over_only %}&amp;over=1{% endif %}{% if kind %}&amp;kind={{ kind }}{% endif %}{% if attribute %}&amp;attribute={{ attribute|urlencode }}{% endif %}{% if role %}&amp;role={{ role|urlencode }}{% endif %}">Next</a>
  {% endif %}
</nav>
{% endif %}
